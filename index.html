<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeBron James 2017-2018 : Comparaison avec le Top 10 NBA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Staatliches&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="chart-container">
    <div class="chart-header">
      <h1 class="chart-title">
        LEBRON JAMES 2017-2018
        <span class="points">POINTS</span>
        <span class="rebounds">REBONDS</span>
        <span class="assists">PASSES</span>
        <span class="par-match">PAR MATCH</span>
      </h1>
      <p class="chart-subtitle">COMPARAISON AVEC LES MOYENNES DU TOP 10 NBA DANS CHAQUE CATÉGORIE</p>
    </div>

    <div id="chart"></div>
    <div id="article-container"></div>
    
    <div class="game-info">
      <div id="current-game" class="current-game"></div>
      <div id="game-phase" class="game-phase"></div>
    </div>

    <div class="legend">
      <svg width="400" height="80">
        <line x1="100" y1="10" x2="130" y2="10" stroke="#FF6B6B" stroke-width="3" stroke-dasharray="5,5" stroke-opacity="0.5"></line>
        <text x="140" y="15" fill="#666">Moy. Top 10 points (26.22)</text>
        <line x1="100" y1="25" x2="130" y2="25" stroke="#4299E1" stroke-width="3" stroke-dasharray="5,5" stroke-opacity="0.5"></line>
        <text x="140" y="30" fill="#666">Moy. Top 10 passes (8.03)</text>
        <line x1="100" y1="40" x2="130" y2="40" stroke="#48BB78" stroke-width="3" stroke-dasharray="5,5" stroke-opacity="0.5"></line>
        <text x="140" y="45" fill="#666">Moy. Top 10 rebonds (12.07)</text>
      </svg>
    </div>

    <div class="legend-container">
      <div class="legend-item">
        <div class="legend-line" style="background-color: #FF6B6B; opacity: 0.5;"></div>
        <div class="legend-text">Moy. Top 10 points (26.22)</div>
      </div>
      <div class="legend-item">
        <div class="legend-line" style="background-color: #4299E1; opacity: 0.5;"></div>
        <div class="legend-text">Moy. Top 10 passes (8.03)</div>
      </div>
      <div class="legend-item">
        <div class="legend-line" style="background-color: #48BB78; opacity: 0.5;"></div>
        <div class="legend-text">Moy. Top 10 rebonds (12.07)</div>
      </div>
    </div>

    <div class="live-stats" id="live-stats">
      <span class="points">-- pts</span>
      <span class="rebounds">-- reb</span>
      <span class="assists">-- ast</span>
    </div>    
    
    <p class="chart-source">
      Source : <a href="https://www.basketball-reference.com/" target="_blank" rel="noopener">basketball-reference.com</a> | Réalisation : LU CONG SANG Kévin
    </p>    
  </div>

  <div class="scroll-spacer"></div>
  <div class="scroll-spacer"></div>
  <div class="scroll-spacer"></div>
  <div class="scroll-spacer"></div>
  <div class="scroll-spacer"></div>
  <div class="end-spacer"></div>
  
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
