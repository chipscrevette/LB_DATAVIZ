        {game:106, points:35, rebounds:15, assists:9, isPlayoffs:true},
        {game:107, points:51, rebounds:8, assists:8, isPlayoffs:true},
        {game:108, points:29, rebounds:9, assists:13, isPlayoffs:true},
        {game:109, points:33, rebounds:10, assists:11, isPlayoffs:true},
        {game:110, points:33, rebounds:10, assists:11, isPlayoffs:true}
      ];
      
      return [...regularSeason, ...playoffs];
    }
    
    // Initialiser le graphique
    function initChart() {
      const data = getGameData();
      const isMobile = window.innerWidth <= 768;
      
      // Préparer les conteneurs
      const articleContainer = document.getElementById('article-container');
      const currentGameDisplay = document.getElementById('current-game');
      const gamePhaseDisplay = document.getElementById('game-phase');
      
      // Configuration du graphique
      const chartDiv = document.getElementById('chart');
      const width = chartDiv.clientWidth;
      const height = chartDiv.clientHeight;
      const margin = { top: 20, right: 40, bottom: 40, left: 50 };
      const innerWidth = width - margin.left - margin.right;
      const innerHeight = height - margin.top - margin.bottom;
      
      // Créer le SVG
      const svg = d3.select('#chart')
        .append('svg')
        .attr('width', width)
        .attr('height', height);
      
      // Groupe principal
      const g = svg.append('g')
        .attr('transform', `translate(${margin.left}, ${margin.top})`);
      
      // Échelles
      const xScale = d3.scaleLinear()
        .domain([1, data.length])
        .range([0, innerWidth]);
      
      const yScale = d3.scaleLinear()
        .domain([0, 60])
        .range([innerHeight, 0]);
      
      // Texte pour saison régulière et playoffs (desktop seulement)
      if (!isMobile) {
        g.append('text')
          .attr('x', xScale(30))
          .attr('y', innerHeight - -14)
          .attr('text-anchor', 'auto')
          .attr('fill', '#888')
          .attr('font-size', '14px')
          .attr('font-weight', '300')
          .attr('font-style', 'italic')
          .text('Saison Régulière');
        
        g.append('text')
          .attr('x', xScale(96))
          .attr('y', innerHeight - -14)
          .attr('text-anchor', 'auto')
          .attr('fill', '#888')
          .attr('font-size', '14px')
          .attr('font-weight', '300')
          .attr('font-style', 'italic')
          .text('Playoffs');
      }
      
      // Ligne verticale pour marquer le début des playoffs
      g.append('line')
        .attr('x1', xScale(83))
        .attr('x2', xScale(83))
        .attr('y1', 0)
        .attr('y2', innerHeight)
        .attr('stroke', '#666')
        .attr('stroke-width', isMobile ? 1 : 2)
        .attr('stroke-dasharray', '3,3')
        .attr('opacity', isMobile ? 0.3 : 1);

      // Label "Début des Playoffs" (desktop seulement)
      if (!isMobile) {
        g.append("text")
          .attr("x", xScale(83) - 10)
          .attr("y", innerHeight * 0.65)
          .attr("transform", `rotate(-90, ${xScale(83) - 10}, ${innerHeight * 0.65})`)
          .attr("font-size", "15px")
          .attr("fill", "#666")
          .attr("font-style", "italic")
          .text("Début des Playoffs");
      }
      
      // Axe Y
      const yAxis = d3.axisLeft(yScale)
        .ticks(isMobile ? 5 : 10)
        .tickSize(-5);
      
      g.append('g')
        .attr('class', 'y-axis')
        .call(yAxis)
        .call(g => g.select('.domain').remove())
        .attr('opacity', isMobile ? 0.3 : 1);
      
      // Définir le générateur de ligne
      const lineGenerator = d3.line()
        .x(d => xScale(d.game))
        .y(d => yScale(d.value))
        .curve(d3.curveLinear);
      
      // Couleurs
      const colors = {
        points: '#FF6B6B',
        rebounds: '#48BB78',
        assists: '#4299E1'
      };
      
      // Lignes hachurées pour les moyennes du Top 10
      g.append('line')
        .attr('class', 'top10-line')
        .attr('x1', 0)
        .attr('x2', innerWidth)
        .attr('y1', yScale(top10Averages.points))
        .attr('y2', yScale(top10Averages.points))
        .attr('stroke', colors.points)
        .attr('stroke-opacity', isMobile ? 0.3 : 0.7);
      
      g.append('line')
        .attr('class', 'top10-line')
        .attr('x1', 0)
        .attr('x2', innerWidth)
        .attr('y1', yScale(top10Averages.assists))
        .attr('y2', yScale(top10Averages.assists))
        .attr('stroke', colors.assists)
        .attr('stroke-opacity', isMobile ? 0.3 : 0.7);
      
      g.append('line')
        .attr('class', 'top10-line')
        .attr('x1', 0)
        .attr('x2', innerWidth)
        .attr('y1', yScale(top10Averages.rebounds))
        .attr('y2', yScale(top10Averages.rebounds))
        .attr('stroke', colors.rebounds)
        .attr('stroke-opacity', isMobile ? 0.3 : 0.7);
      
      // Fonction pour créer les segments de ligne
      function createLine(property, color, strokeWidth) {
        const lineData = data.map(d => ({
          game: d.game,
          value: d[property],
          isPlayoffs: d.isPlayoffs
        }));

        // Créer un segment pour chaque intervalle entre deux matchs
        for (let i = 0; i < lineData.length - 1; i++) {
          const segmentData = [lineData[i], lineData[i + 1]];

          const path = g.append('path')
            .datum(segmentData)
            .attr('class', `segment-${property}`)
            .attr('d', lineGenerator)
            .attr('stroke', color)
            .attr('stroke-width', strokeWidth)
            .attr('fill', 'none')
            .attr('stroke-opacity', 0.2)
            .attr('data-game', lineData[i].game)
            .attr('data-index', i);

          // Animation initiale (desktop seulement)
          if (!isMobile) {
            const totalLength = path.node().getTotalLength();
            path
              .attr("stroke-dasharray", totalLength + " " + totalLength)
              .attr("stroke-dashoffset", totalLength)
              .transition()
              .delay(i * 5)
              .duration(Math.min(1000, totalLength * 10))
              .ease(d3.easeLinear)
              .attr("stroke-dashoffset", 0);
          }
        }
      }
      
      // Créer les trois lignes
      const lineWidth = isMobile ? 2 : 4;
      createLine('points', colors.points, lineWidth);
      createLine('rebounds', colors.rebounds, lineWidth);
      createLine('assists', colors.assists, lineWidth);
      
      // Créer les articles
      gameEvents.forEach((event, index) => {
        const articleHTML = `
          <div class="article-info" id="article-${index}" style="display: none;">
            <div class="article-date">${event.date}</div>
            <div class="article-stats">${event.opponent}</div>
            <div class="article-stats">${event.stats}</div>
            <h2 class="article-title">${event.title}</h2>
            <p class="article-content">${event.content}</p>
          </div>
        `;
        articleContainer.insertAdjacentHTML('beforeend', articleHTML);
      });
      
      // Fonction de mise à jour au défilement
      function updateVisualization() {
        const data = getGameData();
        const totalGames = data.length;
        const scrollY = window.scrollY || window.pageYOffset;
        
        const documentHeight = Math.max(
          document.body.scrollHeight,
          document.body.offsetHeight,
          document.documentElement.clientHeight,
          document.documentElement.scrollHeight,
          document.documentElement.offsetHeight
        );
        const windowHeight = window.innerHeight;
        const scrollMax = documentHeight - windowHeight;
        
        let scrollProgress = scrollY / scrollMax;
        if (isNaN(scrollProgress)) scrollProgress = 0;
        if (scrollProgress > 1) scrollProgress = 1;
        
        // Calcul précis du match actuel
        const matchIndex = Math.min(
          Math.floor(scrollProgress * totalGames),
          totalGames - 1
        );
        
        const currentMatch = data[matchIndex];

        // Mettre à jour les infos du match
        currentGameDisplay.textContent = "Match " + currentMatch.game;
        gamePhaseDisplay.textContent = currentMatch.isPlayoffs ? "Playoffs" : "Saison Régulière";

        // Mise à jour du compteur live
        const liveStatsEl = document.getElementById('live-stats');
        if (liveStatsEl) {
          liveStatsEl.querySelector('.points').textContent = `${currentMatch.points} pts`;
          liveStatsEl.querySelector('.rebounds').textContent = `${currentMatch.rebounds} reb`;
          liveStatsEl.querySelector('.assists').textContent = `${currentMatch.assists} ast`;
        }

        // Trouver l'événement actif
        let activeEventIndex = -1;
        for (let i = 0; i < gameEvents.length; i++) {
          if (gameEvents[i].game <= currentMatch.game) {
            activeEventIndex = i;
          } else {
            break;
          }
        }

        // Afficher l'article correspondant
        document.querySelectorAll('.article-info').forEach((el, i) => {
          el.style.display = i === activeEventIndex ? 'block' : 'none';
        });

        // Mise à jour des segments
        document.querySelectorAll('[class^="segment-"]').forEach(segment => {
          const segmentIndex = parseInt(segment.getAttribute('data-index'));
          const opacity = matchIndex > segmentIndex ? 1.0 : 0.2;
          segment.setAttribute('stroke-opacity', opacity);
        });
      }

      // Écouter le défilement
      window.addEventListener('scroll', () => {
        requestAnimationFrame(updateVisualization);
      });
      
      // Écouteurs tactiles pour mobile
      window.addEventListener('touchmove', () => {
        requestAnimationFrame(updateVisualization);
      });

      window.addEventListener('touchend', () => {
        requestAnimationFrame(updateVisualization);
      });
      
      // Initialiser
      setTimeout(() => {
        window.scrollTo(0, 0);
        updateVisualization();
      }, 100);
    }
    
    // Lancer quand le DOM est prêt
    document.addEventListener('DOMContentLoaded', initChart);
    
    // Reconstruire lors du redimensionnement
    window.addEventListener('resize', () => {
      const oldSvg = document.querySelector('#chart svg');
      if (oldSvg) oldSvg.remove();
      
      // Ajustements responsive
      const isMobile = window.innerWidth <= 768;
      const parMatch = document.querySelector('.par-match');
      
      if (isMobile) {
        if (parMatch) parMatch.style.display = 'none';
        document.querySelectorAll('.chart-title span').forEach(span => {
          if (!span.classList.contains('par-match')) {
            span.style.display = 'block';
            span.style.margin = '5px 0';
            span.style.width = 'auto';
          }
        });
        
        document.querySelector('.live-stats').style.position = 'fixed';
        document.querySelector('.live-stats').style.bottom = '40px';
        document.querySelector('.live-stats').style.top = 'auto';
        document.querySelector('.live-stats').style.left = '0';
        document.querySelector('.live-stats').style.right = '0';
        
        const legend = document.querySelector('.legend');
        if (legend) legend.style.display = 'none';
      } else {
        if (parMatch) parMatch.style.display = 'inline';
        document.querySelectorAll('.chart-title span').forEach(span => {
          span.style.display = 'inline-block';
          span.style.margin = '0 0.3em';
          span.style.width = 'auto';
        });
        
        document.querySelector('.live-stats').style.position = 'absolute';
        document.querySelector('.live-stats').style.top = '140px';
        document.querySelector('.live-stats').style.right = '100px';
        document.querySelector('.live-stats').style.bottom = 'auto';
        document.querySelector('.live-stats').style.left = 'auto';
        
        const legend = document.querySelector('.legend');
        if (legend) legend.style.display = 'block';
      }
      
      // Redessiner le graphique
      initChart();
    });
  </script>
</body>
</html>
